name: Build Modern S-UI

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Upstream S-UI tag
        required: true
        default: v1.6.4
  push:
    branches: [main]
    paths:
      - 'overrides/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUI_UPSTREAM_VERSION: ${{ github.event.inputs.upstream_version || 'v1.6.4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build
        run: |
          chmod +x scripts/build-custom.sh
          ./scripts/build-custom.sh
      - uses: actions/upload-artifact@v4
        with:
          name: s-ui-modern-${{ env.SUI_UPSTREAM_VERSION }}
          path: dist/*.tar.gz
